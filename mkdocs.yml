site_name: GNU pass to CSV
site_url: https://fbossiere.github.io/gnu-pass-to-csv/
site_description: Export a pass password store to a Proton Pass-compatible CSV without handling GPG passphrases
repo_url: https://github.com/fbossiere/gnu-pass-to-csv
repo_name: fbossiere/gnu-pass-to-csv
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Francois Bossiere

theme:
  name: material
  language: en
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - User guide:
      - Command reference: usage.md
      - Entry mapping: entry-mapping.md
  - Security model: security.md
  - Troubleshooting: troubleshooting.md
  - Architecture: architecture.md
  - Development: development.md
  - Maintainer guide:
      - Releasing: releasing.md
      - Repository settings: repository-settings.md
  - Changelog: https://github.com/fbossiere/gnu-pass-to-csv/blob/main/CHANGELOG.md
