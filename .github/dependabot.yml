version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      python-development:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Newer Hatchling releases emit Core Metadata 2.5, which Twine 6.2
      # currently rejects. Revisit after the publishing toolchain supports it.
      - dependency-name: hatchling
        versions: [">=1.28"]
      # Major developer-tool upgrades need an explicit compatibility review.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels: [dependencies, python]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    labels: [dependencies, github-actions]
